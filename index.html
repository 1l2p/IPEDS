<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="data.js"></script>
<script src="lib/chart.umd.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPEDS Explorer</title>
<style>
  :root {
    --bg: #f8f9fa;
    --card: #fff;
    --border: #dee2e6;
    --text: #212529;
    --muted: #6c757d;
    --primary: #0d6efd;
    --primary-hover: #0b5ed7;
    --accent: #e9ecef;
    --selected: #e8f0fe;
    --selection-bar: #1a73e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  header h1 { font-size: 1.25rem; font-weight: 700; white-space: nowrap; }
  header .badge { background: var(--primary); color: #fff; font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 10px; }
  header .year-select-wrap { display: flex; align-items: center; gap: 0.4rem; }
  header .year-select-wrap label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
  header select#yearSelect {
    padding: 0.3rem 0.5rem; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.85rem; background: var(--card); color: var(--text); font-weight: 600;
  }

  .filters { background: var(--card); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select {
    padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.875rem; background: var(--card); color: var(--text);
  }
  .filters input[type="search"] { min-width: 220px; }
  .filters select { max-width: 200px; }
  .filters label { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 0.3rem; cursor: pointer; white-space: nowrap; }
  .range-filter input[type="number"] { width: 60px; padding: 0.4rem 0.4rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.875rem; }
  .filters .sep { width: 1px; height: 24px; background: var(--border); }

  .selection-bar {
    display: none;
    padding: 0.5rem 1.5rem;
    background: var(--selection-bar);
    color: #fff;
    font-size: 0.8rem;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .selection-bar.visible { display: flex; }
  .selection-bar strong { font-weight: 600; }
  .selection-bar button {
    padding: 0.25rem 0.6rem;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 4px;
    background: transparent;
    color: #fff;
    font-size: 0.75rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .selection-bar button:hover { background: rgba(255,255,255,0.15); }
  .selection-bar button.active { background: rgba(255,255,255,0.25); border-color: #fff; }
  .selection-bar .sel-stats { margin-left: auto; display: flex; gap: 1.5rem; flex-wrap: wrap; }

  .stats-bar { padding: 0.5rem 1.5rem; font-size: 0.8rem; color: var(--muted); background: var(--accent); display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center; }
  .stats-bar .trend-btn {
    margin-left: auto;
    padding: 0.2rem 0.5rem;
    border: 1px solid var(--muted);
    border-radius: 4px;
    background: var(--card);
    color: var(--text);
    font-size: 0.75rem;
    cursor: pointer;
  }
  .stats-bar .trend-btn:hover { background: var(--accent); border-color: var(--text); }

  /* Trend chart panel */
  .trend-panel {
    display: none;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
  }
  .trend-panel.visible { display: block; }
  .trend-panel .trend-header {
    display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; flex-wrap: wrap;
  }
  .trend-panel .trend-header h3 { font-size: 0.9rem; font-weight: 600; }
  .trend-panel .trend-header select, .trend-panel .trend-header button {
    padding: 0.3rem 0.5rem; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.8rem; background: var(--card); color: var(--text);
  }
  .trend-panel .trend-header button { cursor: pointer; }
  .trend-panel .trend-header button:hover { background: var(--accent); }
  .trend-panel .trend-header .close-btn {
    margin-left: auto; border: none; font-size: 1.1rem; cursor: pointer;
    color: var(--muted); background: none; padding: 0 0.3rem;
  }
  .trend-panel .trend-header .close-btn:hover { color: var(--text); }
  .trend-chart-wrap { position: relative; height: 320px; }

  .table-wrap { overflow-x: auto; padding: 0 1.5rem 2rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.5rem; }
  thead { position: sticky; top: 0; z-index: 2; }
  th { background: var(--card); border-bottom: 2px solid var(--border); padding: 0.5rem 0.6rem; text-align: left; white-space: nowrap; cursor: pointer; user-select: none; font-weight: 600; }
  th:hover { background: var(--accent); }
  th.check-col { width: 36px; cursor: default; text-align: center; }
  th.check-col:hover { background: var(--card); }
  th .arrow { font-size: 0.7rem; margin-left: 0.25rem; color: var(--muted); }
  th .arrow.active { color: var(--primary); }
  td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td.check-col { text-align: center; width: 36px; }
  tr:hover td { background: #f0f6ff; }
  tr.selected td { background: var(--selected); }
  tr.selected:hover td { background: #d6e5fc; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td a { color: var(--primary); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .hbcu-tag { background: #ffc107; color: #000; font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 3px; margin-left: 0.3rem; font-weight: 600; }
  .open-tag { background: #198754; color: #fff; font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 3px; margin-left: 0.3rem; font-weight: 600; }
  .om-tag { background: #6f42c1; color: #fff; font-size: 0.6rem; padding: 0.1rem 0.3rem; border-radius: 3px; margin-left: 0.3rem; font-weight: 600; cursor: help; }

  .pagination { display: flex; gap: 0.4rem; align-items: center; justify-content: center; padding: 1rem; }
  .pagination button {
    padding: 0.35rem 0.7rem; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); cursor: pointer; font-size: 0.8rem;
  }
  .pagination button:hover { background: var(--accent); }
  .pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .pagination span { font-size: 0.8rem; color: var(--muted); }

  .loading { text-align: center; padding: 4rem; color: var(--muted); font-size: 1.1rem; }
  .empty { text-align: center; padding: 3rem; color: var(--muted); }

  @media (max-width: 768px) {
    .filters { gap: 0.5rem; }
    .filters input[type="search"] { min-width: 100%; }
    header { padding: 0.75rem 1rem; }
    .table-wrap { padding: 0 0.5rem 2rem; }
    .selection-bar { padding: 0.5rem 1rem; }
    .selection-bar .sel-stats { margin-left: 0; }
    .trend-chart-wrap { height: 240px; }
  }
</style>
</head>
<body>

<header>
  <h1>IPEDS Explorer</h1>
  <div class="year-select-wrap">
    <label for="yearSelect">Year:</label>
    <select id="yearSelect"></select>
  </div>
  <span class="badge" id="yearBadge">2024</span>
</header>

<div class="filters" id="filters">
  <input type="search" id="search" placeholder="Search institutions..." autocomplete="off">
  <div class="sep"></div>
  <select id="stateFilter"><option value="">All States</option></select>
  <select id="sectorFilter"><option value="">All Sectors</option></select>
  <label><input type="checkbox" id="hbcuFilter"> HBCU only</label>
  <div class="sep"></div>
  <select id="sizeFilter">
    <option value="">Any Enrollment</option>
    <option value="1000">1,000+</option>
    <option value="5000">5,000+</option>
    <option value="10000">10,000+</option>
    <option value="20000">20,000+</option>
  </select>
  <div class="sep"></div>
  <label class="range-filter">Adm Rate &ge; <input type="number" id="admRateFilter" min="0" max="100" step="5" placeholder="e.g. 50"> %</label>
</div>

<div class="selection-bar" id="selectionBar">
  <strong id="selCount">0 selected</strong>
  <button id="showSelectedBtn" onclick="toggleShowSelected()">Show selected only</button>
  <button id="compareTrendBtn" onclick="showTrendForSelected()">Compare Trends</button>
  <button onclick="clearSelection()">Clear selection</button>
  <div class="sel-stats" id="selStats"></div>
</div>

<div class="trend-panel" id="trendPanel">
  <div class="trend-header">
    <h3>Trend Comparison</h3>
    <select id="trendMetric">
      <option value="totalEnroll">Enrollment</option>
      <option value="gradRate">Graduation Rate</option>
      <option value="admRate">Admission Rate</option>
      <option value="satMid">SAT Midpoint</option>
      <option value="actMid">ACT Midpoint</option>
      <option value="enrollBlack">Black Enrollment</option>
      <option value="enrollHispanic">Hispanic Enrollment</option>
      <option value="enrollWhite">White Enrollment</option>
      <option value="enrollAsian">Asian Enrollment</option>
      <option value="deExclusive">Exclusively Online</option>
      <option value="deSome">Some Online</option>
      <option value="deNone">Not Online</option>
    </select>
    <button id="trendModeBtn" onclick="toggleTrendMode()">Show Group Average</button>
    <button class="close-btn" onclick="closeTrend()" title="Close">&times;</button>
  </div>
  <div class="trend-chart-wrap">
    <canvas id="trendChart"></canvas>
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="table-wrap">
  <div class="loading" id="loading">Loading IPEDS data...</div>
  <table id="dataTable" style="display:none">
    <thead>
      <tr id="headerRow"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No institutions match your filters.</div>
</div>

<div class="pagination" id="pagination"></div>

<script>
const COLUMNS = [
  { key: "name", label: "Institution", type: "string", render: renderName },
  { key: "city", label: "City", type: "string" },
  { key: "state", label: "State", type: "string" },
  { key: "sector", label: "Sector", type: "string" },
  { key: "totalEnroll", label: "Enrollment", type: "number", fmt: fmtNum },
  { key: "gradRate", label: "Grad Rate", type: "number", render: renderGradRate },
  { key: "admRate", label: "Adm Rate", type: "number", render: renderAdmRate },
  { key: "satMid", label: "SAT Mid", type: "number", fmt: fmtNum },
  { key: "actMid", label: "ACT Mid", type: "number", fmt: fmtNum },
  { key: "enrollBlack", label: "Black", type: "number", fmt: fmtNum },
  { key: "enrollHispanic", label: "Hispanic", type: "number", fmt: fmtNum },
  { key: "enrollWhite", label: "White", type: "number", fmt: fmtNum },
  { key: "deExclusive", label: "Online Only", type: "number", fmt: fmtNum },
  { key: "deSome", label: "Some Online", type: "number", fmt: fmtNum },
  { key: "deNone", label: "Not Online", type: "number", fmt: fmtNum },
];

const PAGE_SIZE = 50;

// Multi-year data
let fullData = [];        // raw data with yearData nesting
let availableYears = [];  // [2014, 2015, ..., 2024]
let currentYear = 2024;

// Flattened view for current year (backwards compatible with existing code)
let allData = [];
let filtered = [];
let sortKey = "totalEnroll";
let sortAsc = false;
let currentPage = 0;

// Selection state
const selected = new Set();
let showSelectedOnly = false;

// Trend chart state
let trendChart = null;
let trendMode = "selected"; // "selected" or "group"

// ── Formatting helpers ──────────────────────────────────────────────
function fmtNum(v) { return v != null ? v.toLocaleString() : "\u2014"; }
function fmtPct(v) { return v != null ? v.toFixed(1) + "%" : "\u2014"; }

function renderName(row) {
  let html = "";
  if (row.webAddr) {
    let url = row.webAddr;
    if (url && !url.startsWith("http")) url = "https://" + url;
    html = `<a href="${url}" target="_blank" rel="noopener">${esc(row.name)}</a>`;
  } else {
    html = esc(row.name);
  }
  if (row.hbcu) html += ' <span class="hbcu-tag">HBCU</span>';
  return html;
}

function renderGradRate(row) {
  if (row.gradRate == null) return "\u2014";
  const pct = row.gradRate.toFixed(1) + "%";
  if (row.gradSource === "OM") return pct + ' <span class="om-tag" title="8-year completion rate from Outcome Measures">OM</span>';
  return pct;
}

function renderAdmRate(row) {
  if (row.admRate == null) return "\u2014";
  if (row.openAdmission) return '100% <span class="open-tag">Open</span>';
  return row.admRate.toFixed(1) + "%";
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// ── Multi-year data flattening ──────────────────────────────────────
function flattenForYear(data, year) {
  const yStr = String(year);
  return data
    .filter(inst => inst.yearData && inst.yearData[yStr])
    .map(inst => {
      const yd = inst.yearData[yStr];
      return {
        id: inst.id,
        name: inst.name,
        city: inst.city,
        state: inst.state,
        lat: inst.lat,
        lng: inst.lng,
        webAddr: inst.webAddr,
        hbcu: inst.hbcu,
        ...yd,
      };
    })
    .filter(r => r.totalEnroll && r.totalEnroll > 0);
}

function switchYear(year) {
  currentYear = year;
  document.getElementById("yearBadge").textContent = year;
  allData = flattenForYear(fullData, year);
  applyFilters();
  if (document.getElementById("trendPanel").classList.contains("visible")) {
    renderTrend();
  }
}

// ── Init ────────────────────────────────────────────────────────────
async function init() {
  const json = typeof IPEDS_DATA !== "undefined"
    ? IPEDS_DATA
    : await fetch("data.json").then(r => r.json());

  fullData = json.data;
  availableYears = json.years || [2024];
  currentYear = json.defaultYear || availableYears[availableYears.length - 1];

  // Populate year selector
  const yearSelect = document.getElementById("yearSelect");
  availableYears.forEach(y => {
    const opt = document.createElement("option");
    opt.value = y; opt.textContent = y;
    if (y === currentYear) opt.selected = true;
    yearSelect.appendChild(opt);
  });
  yearSelect.addEventListener("change", () => switchYear(parseInt(yearSelect.value)));

  document.getElementById("yearBadge").textContent = currentYear;

  // Flatten for default year
  allData = flattenForYear(fullData, currentYear);

  // Populate filter dropdowns
  const stateSelect = document.getElementById("stateFilter");
  (json.states || []).forEach(s => {
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = s;
    stateSelect.appendChild(opt);
  });
  const sectorSelect = document.getElementById("sectorFilter");
  (json.sectors || []).forEach(s => {
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = s;
    sectorSelect.appendChild(opt);
  });

  buildHeader();
  applyFilters();

  document.getElementById("loading").style.display = "none";
  document.getElementById("dataTable").style.display = "";

  // Wire up filter events
  document.getElementById("search").addEventListener("input", debounce(applyFilters, 200));
  document.getElementById("stateFilter").addEventListener("change", applyFilters);
  document.getElementById("sectorFilter").addEventListener("change", applyFilters);
  document.getElementById("hbcuFilter").addEventListener("change", applyFilters);
  document.getElementById("sizeFilter").addEventListener("change", applyFilters);
  document.getElementById("admRateFilter").addEventListener("input", debounce(applyFilters, 300));

  // Trend metric change
  document.getElementById("trendMetric").addEventListener("change", renderTrend);
}

function debounce(fn, ms) {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// ── Table header ────────────────────────────────────────────────────
function buildHeader() {
  const row = document.getElementById("headerRow");
  const thCheck = document.createElement("th");
  thCheck.className = "check-col";
  thCheck.innerHTML = '<input type="checkbox" id="selectAllCheck" title="Select all on this page">';
  thCheck.querySelector("input").addEventListener("change", toggleSelectAll);
  row.appendChild(thCheck);

  COLUMNS.forEach(col => {
    const th = document.createElement("th");
    th.dataset.key = col.key;
    th.innerHTML = `${col.label} <span class="arrow" id="arrow-${col.key}"></span>`;
    th.addEventListener("click", () => toggleSort(col.key));
    row.appendChild(th);
  });
  updateSortArrows();
}

function toggleSort(key) {
  if (sortKey === key) { sortAsc = !sortAsc; }
  else { sortKey = key; sortAsc = false; }
  updateSortArrows();
  sortData();
  currentPage = 0;
  renderTable();
}

function updateSortArrows() {
  COLUMNS.forEach(col => {
    const el = document.getElementById("arrow-" + col.key);
    if (col.key === sortKey) {
      el.className = "arrow active";
      el.textContent = sortAsc ? "\u25B2" : "\u25BC";
    } else {
      el.className = "arrow";
      el.textContent = "";
    }
  });
}

// ── Filtering & sorting ─────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const state = document.getElementById("stateFilter").value;
  const sector = document.getElementById("sectorFilter").value;
  const hbcuOnly = document.getElementById("hbcuFilter").checked;
  const minSize = parseInt(document.getElementById("sizeFilter").value) || 0;
  const minAdmRate = parseFloat(document.getElementById("admRateFilter").value);

  filtered = allData.filter(r => {
    if (showSelectedOnly && !selected.has(r.id)) return false;
    if (q && !r.name.toLowerCase().includes(q) && !r.city.toLowerCase().includes(q)) return false;
    if (state && r.state !== state) return false;
    if (sector && r.sector !== sector) return false;
    if (hbcuOnly && !r.hbcu) return false;
    if (minSize && (!r.totalEnroll || r.totalEnroll < minSize)) return false;
    if (minAdmRate > 0 && (r.admRate == null || r.admRate < minAdmRate)) return false;
    return true;
  });

  sortData();
  currentPage = 0;
  renderTable();
  updateStats();
}

function sortData() {
  const col = COLUMNS.find(c => c.key === sortKey);
  const isNum = col && col.type === "number";
  filtered.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (va == null) va = isNum ? -Infinity : "";
    if (vb == null) vb = isNum ? -Infinity : "";
    let cmp;
    if (isNum) { cmp = va - vb; }
    else { cmp = String(va).localeCompare(String(vb)); }
    return sortAsc ? cmp : -cmp;
  });
}

// ── Table rendering ─────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById("tableBody");
  const start = currentPage * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);

  if (filtered.length === 0) {
    tbody.innerHTML = "";
    document.getElementById("empty").style.display = "";
    document.getElementById("pagination").innerHTML = "";
    updateSelectAllCheckbox();
    return;
  }
  document.getElementById("empty").style.display = "none";

  let html = "";
  page.forEach(row => {
    const isSel = selected.has(row.id);
    html += `<tr class="${isSel ? "selected" : ""}">`;
    html += `<td class="check-col"><input type="checkbox" ${isSel ? "checked" : ""} data-id="${row.id}"></td>`;
    COLUMNS.forEach(col => {
      const cls = col.type === "number" ? ' class="num"' : "";
      let val;
      if (col.render) { val = col.render(row); }
      else if (col.fmt) { val = col.fmt(row[col.key]); }
      else { val = esc(String(row[col.key] ?? "\u2014")); }
      html += `<td${cls}>${val}</td>`;
    });
    html += "</tr>";
  });
  tbody.innerHTML = html;

  tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", () => toggleRow(cb.dataset.id, cb.checked));
  });

  updateSelectAllCheckbox();
  renderPagination();
}

// ── Selection ───────────────────────────────────────────────────────
function toggleRow(id, isChecked) {
  if (isChecked) { selected.add(id); } else { selected.delete(id); }
  const tbody = document.getElementById("tableBody");
  tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.closest("tr").className = selected.has(cb.dataset.id) ? "selected" : "";
  });
  updateSelectAllCheckbox();
  updateSelectionBar();
  updateStats();
}

function toggleSelectAll(e) {
  const start = currentPage * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);
  const checked = e.target.checked;
  page.forEach(row => { if (checked) selected.add(row.id); else selected.delete(row.id); });
  renderTable();
  updateSelectionBar();
  updateStats();
}

function updateSelectAllCheckbox() {
  const cb = document.getElementById("selectAllCheck");
  if (!cb) return;
  const start = currentPage * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);
  if (page.length === 0) { cb.checked = false; cb.indeterminate = false; return; }
  const selCount = page.filter(r => selected.has(r.id)).length;
  cb.checked = selCount === page.length;
  cb.indeterminate = selCount > 0 && selCount < page.length;
}

function toggleShowSelected() {
  showSelectedOnly = !showSelectedOnly;
  const btn = document.getElementById("showSelectedBtn");
  btn.className = showSelectedOnly ? "active" : "";
  btn.textContent = showSelectedOnly ? "Show all" : "Show selected only";
  applyFilters();
}

function clearSelection() {
  selected.clear();
  showSelectedOnly = false;
  const btn = document.getElementById("showSelectedBtn");
  btn.className = "";
  btn.textContent = "Show selected only";
  applyFilters();
  updateSelectionBar();
  closeTrend();
}

// ── Aggregates & stats ──────────────────────────────────────────────
function computeAggregates(rows) {
  const total = rows.length;
  const totalEnroll = rows.reduce((s, r) => s + (r.totalEnroll || 0), 0);
  const withGrad = rows.filter(r => r.gradRate != null);
  const avgGrad = withGrad.length > 0
    ? (withGrad.reduce((s, r) => s + r.gradRate, 0) / withGrad.length).toFixed(1)
    : null;
  const withAdm = rows.filter(r => r.admRate != null);
  const avgAdm = withAdm.length > 0
    ? (withAdm.reduce((s, r) => s + r.admRate, 0) / withAdm.length).toFixed(1)
    : null;
  return { total, totalEnroll, avgGrad, withGrad: withGrad.length, avgAdm, withAdm: withAdm.length };
}

function updateSelectionBar() {
  const bar = document.getElementById("selectionBar");
  const countEl = document.getElementById("selCount");
  const statsEl = document.getElementById("selStats");

  if (selected.size === 0) {
    bar.classList.remove("visible");
    return;
  }

  bar.classList.add("visible");
  countEl.textContent = `${selected.size.toLocaleString()} selected`;

  const selRows = allData.filter(r => selected.has(r.id));
  const agg = computeAggregates(selRows);

  let html = `<span>Enrollment: <strong>${agg.totalEnroll.toLocaleString()}</strong></span>`;
  if (agg.avgGrad != null) { html += `<span>Avg grad rate: <strong>${agg.avgGrad}%</strong></span>`; }
  if (agg.avgAdm != null) { html += `<span>Avg adm rate: <strong>${agg.avgAdm}%</strong></span>`; }
  statsEl.innerHTML = html;
}

function updateStats() {
  const bar = document.getElementById("statsBar");
  const agg = computeAggregates(filtered);

  let html = `
    <span><strong>${agg.total.toLocaleString()}</strong> institutions (${currentYear})</span>
    <span>Total enrollment: <strong>${agg.totalEnroll.toLocaleString()}</strong></span>
    <span>Avg grad rate: <strong>${agg.avgGrad != null ? agg.avgGrad + "%" : "\u2014"}</strong> (${agg.withGrad.toLocaleString()} reporting)</span>
    <span>${agg.withAdm.toLocaleString()} with admissions data</span>
  `;

  // Add group trend button
  if (filtered.length > 0 && availableYears.length > 1) {
    html += `<button class="trend-btn" onclick="showTrendForGroup()">Group Trend</button>`;
  }

  bar.innerHTML = html;
}

// ── Pagination ──────────────────────────────────────────────────────
function renderPagination() {
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  const div = document.getElementById("pagination");
  if (totalPages <= 1) { div.innerHTML = ""; return; }

  let html = "";
  html += `<button ${currentPage === 0 ? "disabled" : ""} onclick="goPage(${currentPage - 1})">← Prev</button>`;
  html += `<span>Page ${currentPage + 1} of ${totalPages}</span>`;
  html += `<button ${currentPage >= totalPages - 1 ? "disabled" : ""} onclick="goPage(${currentPage + 1})">Next →</button>`;
  div.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  renderTable();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ── Trend Charts ────────────────────────────────────────────────────
const CHART_COLORS = [
  "#0d6efd", "#dc3545", "#198754", "#fd7e14", "#6f42c1",
  "#20c997", "#e83e8c", "#6610f2", "#0dcaf0", "#ffc107",
];

const METRIC_LABELS = {
  totalEnroll: "Enrollment",
  gradRate: "Graduation Rate (%)",
  admRate: "Admission Rate (%)",
  satMid: "SAT Midpoint",
  actMid: "ACT Midpoint",
  enrollBlack: "Black Enrollment",
  enrollHispanic: "Hispanic Enrollment",
  enrollWhite: "White Enrollment",
  enrollAsian: "Asian Enrollment",
  deExclusive: "Exclusively Online",
  deSome: "Some Online",
  deNone: "Not Online",
};

function showTrendForSelected() {
  if (selected.size === 0) return;
  trendMode = "selected";
  document.getElementById("trendModeBtn").textContent = "Show Group Average";
  document.getElementById("trendPanel").classList.add("visible");
  renderTrend();
}

function showTrendForGroup() {
  trendMode = "group";
  document.getElementById("trendModeBtn").textContent = "Show Selected Institutions";
  document.getElementById("trendPanel").classList.add("visible");
  renderTrend();
}

function toggleTrendMode() {
  if (trendMode === "selected") {
    trendMode = "group";
    document.getElementById("trendModeBtn").textContent = "Show Selected Institutions";
  } else {
    trendMode = "selected";
    document.getElementById("trendModeBtn").textContent = "Show Group Average";
  }
  renderTrend();
}

function closeTrend() {
  document.getElementById("trendPanel").classList.remove("visible");
  if (trendChart) { trendChart.destroy(); trendChart = null; }
}

function getInstTimeSeries(inst, metric) {
  return availableYears.map(y => {
    const yd = inst.yearData ? inst.yearData[String(y)] : null;
    return yd ? (yd[metric] ?? null) : null;
  });
}

function renderTrend() {
  const metric = document.getElementById("trendMetric").value;
  const ctx = document.getElementById("trendChart").getContext("2d");

  if (trendChart) { trendChart.destroy(); trendChart = null; }

  const datasets = [];

  if (trendMode === "selected" && selected.size > 0) {
    // One line per selected institution
    let idx = 0;
    for (const id of selected) {
      const inst = fullData.find(d => d.id === id);
      if (!inst) continue;
      datasets.push({
        label: inst.name,
        data: getInstTimeSeries(inst, metric),
        borderColor: CHART_COLORS[idx % CHART_COLORS.length],
        backgroundColor: CHART_COLORS[idx % CHART_COLORS.length] + "33",
        tension: 0.3,
        spanGaps: true,
        pointRadius: 3,
      });
      idx++;
    }
  } else {
    // Group average: average metric across all currently filtered institutions
    const filteredIds = new Set(filtered.map(r => r.id));
    const filteredInsts = fullData.filter(d => filteredIds.has(d.id));

    const data = availableYears.map(y => {
      const yStr = String(y);
      const values = filteredInsts
        .map(inst => inst.yearData && inst.yearData[yStr] ? inst.yearData[yStr][metric] : null)
        .filter(v => v != null);
      return values.length > 0
        ? values.reduce((a, b) => a + b, 0) / values.length
        : null;
    });

    datasets.push({
      label: `Average (${filtered.length} institutions)`,
      data: data,
      borderColor: CHART_COLORS[0],
      backgroundColor: CHART_COLORS[0] + "33",
      tension: 0.3,
      spanGaps: true,
      pointRadius: 4,
      fill: true,
    });
  }

  trendChart = new Chart(ctx, {
    type: "line",
    data: {
      labels: availableYears.map(String),
      datasets: datasets,
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          position: "top",
          labels: { boxWidth: 12, font: { size: 11 } },
        },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const v = ctx.parsed.y;
              if (v == null) return ctx.dataset.label + ": N/A";
              if (metric === "gradRate" || metric === "admRate") {
                return ctx.dataset.label + ": " + v.toFixed(1) + "%";
              }
              return ctx.dataset.label + ": " + Math.round(v).toLocaleString();
            },
          },
        },
      },
      scales: {
        x: { grid: { display: false } },
        y: {
          title: { display: true, text: METRIC_LABELS[metric] || metric },
          beginAtZero: false,
        },
      },
    },
  });
}

// ── Bootstrap ───────────────────────────────────────────────────────
init();
</script>
